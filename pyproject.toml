[tool.poetry]
name = "task-parser"
version = "0.1.0"
description = "Parser for Codeforces problems"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = "^2.0.28"
requests = "^2.31.0"
python-telegram-bot = "^20.7"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"
celery = "^5.3.6"
redis = "^5.0.3"
celery-redbeat = "^2.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.5"
pytest-mock = "^3.12.0"
aioresponses = "^0.7.6"
responses = "^0.24.1"
httpx = ">=0.25.2,<0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = """
    --cov=src
    --cov-report=term-missing
    --cov-fail-under=85
    -p no:warnings
"""

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "raise ImportError",
]


