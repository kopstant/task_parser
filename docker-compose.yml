version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  celery_worker:
    build: .
    command: >
      celery -A celery_config.celery_app worker
      --loglevel=info
      -Q parsing,default
      --concurrency=4
    environment:
      - DEBUG=${DEBUG}
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    command: celery -A celery_config.celery_app beat --loglevel=info
    depends_on:
      - redis
      - db

  telegram_bot:
    build: .
    command: python -m src.bot.main  # Укажите правильный путь к вашему основному файлу бота
    environment:
      - PYTHONPATH=/app/src  # Основной путь к вашим модулям
      - PYTHONPATH=${PYTHONPATH}:/app  # Дополнительные пути
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}  # Токен из переменных окружения
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_NAME}
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=${DEBUG}
    depends_on:
      - db
      - redis
    volumes:
      - .:/app  # Для разработки, чтобы изменения применялись без пересборки
    restart: unless-stopped  # Автоматически перезапускать при падении

volumes:
  postgres_data: